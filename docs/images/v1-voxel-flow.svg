  <text x="55" y="58" fill="#fff1f2" font-family="Segoe UI,Arial" font-size="30" font-weight="700">V1-Experiment: новая воксельная надстройка над старым UI</text>
  <g fill="#451827" stroke="#fb7185" stroke-width="2"><rect x="55" y="120" width="210" height="135" rx="14"/><rect x="325" y="120" width="250" height="135" rx="14"/><rect x="635" y="90" width="200" height="95" rx="14"/><rect x="635" y="220" width="200" height="95" rx="14"/><rect x="895" y="120" width="150" height="135" rx="14"/></g>
