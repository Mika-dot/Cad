<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Слои V1-Experiment</title><desc id="desc">Примитивы и история операций работают со sparse voxel grid и несколькими выходами.</desc>
