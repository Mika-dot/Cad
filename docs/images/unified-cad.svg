<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура Unified-CAD</title><desc id="desc">Рабочий маршрут из языка в сетку и отдельные заготовки документа и полей.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#60a5fa"/></marker></defs>
  <rect width="1120" height="470" rx="24" fill="#091426"/>
  <text x="55" y="58" fill="#eff6ff" font-family="Segoe UI,Arial" font-size="30" font-weight="700">Unified-CAD: что связано в работающий маршрут</text>
  <g fill="#162d50" stroke="#60a5fa" stroke-width="2"><rect x="50" y="115" width="180" height="105" rx="14"/><rect x="275" y="115" width="180" height="105" rx="14"/><rect x="500" y="115" width="180" height="105" rx="14"/><rect x="725" y="115" width="180" height="105" rx="14"/></g>
  <g fill="#dbeafe" font-family="Segoe UI,Arial" text-anchor="middle"><text x="140" y="158" font-size="21" font-weight="700">.dcad</text><text x="140" y="190" font-size="14">параметры и операции</text><text x="365" y="158" font-size="21" font-weight="700">DCad.Language</text><text x="365" y="190" font-size="14">parser + evaluator</text><text x="590" y="151" font-size="21" font-weight="700">ManifoldNET</text><text x="590" y="183" font-size="14">mesh CSG</text><text x="815" y="151" font-size="21" font-weight="700">Mesh3d</text><text x="815" y="183" font-size="14">аудит topology</text></g>
  <g stroke="#60a5fa" stroke-width="3" marker-end="url(#a)"><line x1="230" y1="168" x2="265" y2="168"/><line x1="455" y1="168" x2="490" y2="168"/><line x1="680" y1="168" x2="715" y2="168"/></g>
  <rect x="950" y="92" width="125" height="65" rx="12" fill="#1d4ed8"/><rect x="950" y="180" width="125" height="65" rx="12" fill="#1d4ed8"/><text x="1012" y="132" fill="white" font-family="Segoe UI,Arial" font-size="18" font-weight="700" text-anchor="middle">CLI → OBJ</text><text x="1012" y="220" fill="white" font-family="Segoe UI,Arial" font-size="18" font-weight="700" text-anchor="middle">App → GL</text><path d="M905 148 L940 125" stroke="#60a5fa" stroke-width="3" marker-end="url(#a)"/><path d="M905 188 L940 210" stroke="#60a5fa" stroke-width="3" marker-end="url(#a)"/>
  <g fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"><rect x="190" y="310" width="300" height="95" rx="14"/><rect x="630" y="310" width="300" height="95" rx="14"/></g>
  <text x="340" y="350" fill="#cbd5e1" font-family="Segoe UI,Arial" font-size="20" font-weight="700" text-anchor="middle">DocumentGraph + undo/redo</text><text x="340" y="379" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="14" text-anchor="middle">есть в библиотеке, не подключено к UI/CLI</text><text x="780" y="350" fill="#cbd5e1" font-family="Segoe UI,Arial" font-size="20" font-weight="700" text-anchor="middle">Fields + NPZ/protocol</text><text x="780" y="379" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="14" text-anchor="middle">есть в библиотеке, не отображается в App</text>
</svg>
