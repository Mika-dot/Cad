<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Три слоя V2-Experiment</title><desc id="desc">Исторический интерфейс, управляемая BSP-реализация и интеграционный проект.</desc>
  <rect width="1100" height="430" rx="24" fill="#120d24"/>
  <text x="55" y="58" fill="#faf5ff" font-family="Segoe UI,Arial" font-size="30" font-weight="700">V2-Experiment: три разных реализации, а не одно приложение</text>
  <g font-family="Segoe UI,Arial"><rect x="55" y="110" width="300" height="230" rx="16" fill="#31204f" stroke="#c084fc" stroke-width="2"/><rect x="400" y="110" width="300" height="230" rx="16" fill="#31204f" stroke="#c084fc" stroke-width="2"/><rect x="745" y="110" width="300" height="230" rx="16" fill="#31204f" stroke="#c084fc" stroke-width="2"/>
  <text x="205" y="155" fill="#f3e8ff" font-size="23" font-weight="700" text-anchor="middle">GL/</text><text x="205" y="190" fill="#d8b4fe" font-size="15" text-anchor="middle">WinForms + SharpGL</text><text x="205" y="222" fill="#d8b4fe" font-size="15" text-anchor="middle">ручные OR/XOR</text><text x="205" y="254" fill="#fda4af" font-size="14" text-anchor="middle">float, Random, эвристики</text><text x="205" y="304" fill="#c4b5fd" font-size="14" text-anchor="middle">исторический код</text>
  <text x="550" y="155" fill="#f3e8ff" font-size="23" font-weight="700" text-anchor="middle">ModernV2/</text><text x="550" y="190" fill="#d8b4fe" font-size="15" text-anchor="middle">managed BSP CSG</text><text x="550" y="222" fill="#d8b4fe" font-size="15" text-anchor="middle">STL/OBJ + self-tests</text><text x="550" y="254" fill="#fde68a" font-size="14" text-anchor="middle">фиксированный epsilon</text><text x="550" y="304" fill="#c4b5fd" font-size="14" text-anchor="middle">эталон для экспериментов</text>
  <text x="895" y="155" fill="#f3e8ff" font-size="23" font-weight="700" text-anchor="middle">Production/</text><text x="895" y="190" fill="#d8b4fe" font-size="15" text-anchor="middle">ManifoldNET + .dcad</text><text x="895" y="222" fill="#d8b4fe" font-size="15" text-anchor="middle">CLI · OpenTK · xUnit</text><text x="895" y="254" fill="#86efac" font-size="14" text-anchor="middle">интеграционный прототип</text><text x="895" y="304" fill="#c4b5fd" font-size="14" text-anchor="middle">дублирует Unified-CAD</text></g>
  <text x="55" y="385" fill="#c4b5fd" font-family="Segoe UI,Arial" font-size="16">Основной долгосрочный путь находится в ветке Unified-CAD; каталог Production нужен для сравнения и переноса.</text>
</svg>
