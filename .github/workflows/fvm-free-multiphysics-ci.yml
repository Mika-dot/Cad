name: Free-topology multiphysics focused regression
on:
  push:
    branches: [feature/fvm-generative-mechanics]
    paths:
      - 'experiments/FvmGenerativeDemo/FreeTopologyDesign.cs'
      - 'experiments/FvmGenerativeDemo/HexFemMultiphysics.cs'
      - 'experiments/FvmGenerativeDemo/MultiphysicsSelfTest.cs'
      - 'experiments/FvmGenerativeDemo/free_topology_multiphysics.json'
      - '.github/workflows/fvm-free-multiphysics-ci.yml'
  workflow_dispatch:
jobs:
  multiphysics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile solver
        run: dotnet build experiments/FvmGenerativeDemo/FvmGenerativeDemo.csproj -c Release --warnaserror
      - name: Solve multi-load free topology with all physical constraints and finite difference
        run: dotnet run --project experiments/FvmGenerativeDemo -c Release --no-build -- --free-topology experiments/FvmGenerativeDemo/free_topology_multiphysics.json --iterations 1 --gradient-check --self-test --refinement-report --out output/multiphysics
      - name: Verify source fixture preservation and output STL
        run: |
          python experiments/FvmGenerativeDemo/validate_stl.py output/multiphysics/initial.stl output/multiphysics/optimized.stl
          python experiments/FvmGenerativeDemo/validate_free_topology.py experiments/FvmGenerativeDemo/free_topology_multiphysics.json output/multiphysics
      - name: Verify three-level mesh convergence status is not confused with mechanical certification
        run: |
          python - <<'PY'
          import json, pathlib
          path=pathlib.Path("output/multiphysics")
          report=json.loads((path/"mesh_refinement.json").read_text())
          summary=json.loads((path/"summary.json").read_text())
          assert len(report["entries"])==3, report
          assert summary["meshConvergenceScreenPassed"]==report["convergenceScreenPassed"]
          assert summary["verifiedManufacturingStrength"] is False
          print("PASS mesh refinement report:",report["entries"])
          print("MESH CONVERGENCE SCREEN:",report["convergenceScreenPassed"])
          PY
      - name: Require explicit failure when three-grid stress convergence is not demonstrated
        run: |
          python - <<'PY'
          import json, subprocess, pathlib
          base=pathlib.Path("output/multiphysics")
          result=json.loads((base/"mesh_refinement.json").read_text())
          if result["convergenceScreenPassed"] is not False:
              raise RuntimeError("Expected regression fixture to demonstrate a non-converged FEM stress estimate")
          args=[
              "dotnet","run","--project","experiments/FvmGenerativeDemo",
              "-c","Release","--no-build","--",
              "--free-topology","experiments/FvmGenerativeDemo/free_topology_multiphysics.json",
              "--iterations","1","--gradient-check","--refinement-report",
              "--require-mesh-convergence","--out","output/nonconverged-rejection"
          ]
          p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=180)
          assert p.returncode!=0, "Nonconverged FEM was wrongly accepted as verified"
          assert "MESH CONVERGENCE NOT DEMONSTRATED" in p.stdout,p.stdout[-2500:]
          assert not pathlib.Path("output/nonconverged-rejection/optimized.stl").exists(),(
              "Unsafe nonconverged STL was exported")
          print("PASS: strict FEM convergence gate refuses nonconverged output")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-topology-multiphysics-results
          path: output/multiphysics
          if-no-files-found: warn
