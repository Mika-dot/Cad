name: OpenGL foundation CI

on:
  push:
    branches: [ "OpenGL" ]
  pull_request:
    branches: [ "OpenGL" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2
      - name: Restore packages
        run: nuget restore OpenGL_lesson_CSharp\OpenGL_lesson_CSharp.sln
      - name: Build Release x86
        run: msbuild OpenGL_lesson_CSharp\OpenGL_lesson_CSharp.sln /m /p:Configuration=Release /p:Platform=x86 /p:RestorePackages=false
