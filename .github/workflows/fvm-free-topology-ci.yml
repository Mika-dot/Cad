name: FVM free topology focused verification
on:
  push:
    branches: [feature/fvm-generative-mechanics]
    paths:
      - 'experiments/FvmGenerativeDemo/FreeTopologyDesign.cs'
      - 'experiments/FvmGenerativeDemo/HexFemMultiphysics.cs'
      - 'experiments/FvmGenerativeDemo/MultiphysicsSelfTest.cs'
      - 'experiments/FvmGenerativeDemo/HexFem.cs'
      - 'experiments/FvmGenerativeDemo/TwoSphereDesign.cs'
      - 'experiments/FvmGenerativeDemo/free_topology_3_bodies.json'
      - 'experiments/FvmGenerativeDemo/validate_stl.py'
      - 'experiments/FvmGenerativeDemo/validate_free_topology.py'
      - 'experiments/FvmGenerativeDemo/free_topology_6_bodies.json'
      - 'experiments/FvmGenerativeDemo/free_topology_multiphysics.json'
      - '.github/workflows/fvm-free-topology-ci.yml'
  workflow_dispatch:
jobs:
  free-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Strict compile including all FVM free-design code
        run: dotnet build experiments/FvmGenerativeDemo/FvmGenerativeDemo.csproj -c Release --warnaserror
      - name: Evaluate free topology under multiple static, modal, pulse and thermal constraints
        run: dotnet run --project experiments/FvmGenerativeDemo -c Release --no-build -- --free-topology experiments/FvmGenerativeDemo/free_topology_multiphysics.json --iterations 1 --gradient-check --self-test --refinement-report --out output/free-multiphysics
      - name: Verify multiphysics binary mechanics and obstacle geometry
        run: python experiments/FvmGenerativeDemo/validate_free_topology.py experiments/FvmGenerativeDemo/free_topology_multiphysics.json output/free-multiphysics
      - name: Assert multiphysics free-field STL reduction
        run: python experiments/FvmGenerativeDemo/validate_stl.py output/free-multiphysics/initial.stl output/free-multiphysics/optimized.stl
      - name: Execute FEM verified free 5M topology and gradient test
        run: dotnet run --project experiments/FvmGenerativeDemo -c Release --no-build -- --free-topology experiments/FvmGenerativeDemo/free_topology_3_bodies.json --iterations 3 --gradient-check --self-test --out output/free
      - name: Assert printable connected and reduced STL volume
        run: python experiments/FvmGenerativeDemo/validate_stl.py output/free/initial.stl output/free/optimized.stl
      - name: Independently verify protected bodies, void nucleation, keepouts and binary FEM
        run: python experiments/FvmGenerativeDemo/validate_free_topology.py experiments/FvmGenerativeDemo/free_topology_3_bodies.json output/free --require-void
      - name: Six-body non-parametric FVM+Hex8 structural optimization with two keepouts
        run: dotnet run --project experiments/FvmGenerativeDemo -c Release --no-build -- --free-topology experiments/FvmGenerativeDemo/free_topology_6_bodies.json --iterations 3 --gradient-check --self-test --out output/free-six
      - name: Check six-body final geometry and numerical material reduction
        run: python experiments/FvmGenerativeDemo/validate_stl.py output/free-six/initial.stl output/free-six/optimized.stl
      - name: Independently verify six-body geometry, forbidden volumes and binary stress
        run: python experiments/FvmGenerativeDemo/validate_free_topology.py experiments/FvmGenerativeDemo/free_topology_6_bodies.json output/free-six
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-topology-fvm-verification
          path: output/
          if-no-files-found: warn
