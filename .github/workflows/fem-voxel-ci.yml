name: FEM Voxel CI

on:
  push:
    branches: [ "FEM_Voxel" ]
  pull_request:
    branches: [ "FEM_Voxel" ]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile modules
        run: python -m compileall -q openscad_gen main.py ui_app.py
      - name: Field exchange smoke test
        run: |
          python - <<'PY'
          import numpy as np
          from openscad_gen.field_exchange import linear_field_to_grid
          shape=(4,5,3)
          ids=np.array([0, 5, 20, 59])
          values=np.array([1.,2.,3.,4.])
          field=linear_field_to_grid(shape,ids,values)
          assert field.shape==shape
          assert np.isclose(field.sum(),10.0)
          print('field smoke ok')
          PY
