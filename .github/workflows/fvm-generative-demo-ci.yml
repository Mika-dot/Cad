name: FVM generative mechanics numerical CI
on:
  push:
    branches:
      - feature/fvm-generative-mechanics
    paths:
      - 'experiments/FvmGenerativeDemo/**'
      - 'src/DCad.FunctionalVoxel/**'
      - '.github/workflows/fvm-generative-demo-ci.yml'
  workflow_dispatch:

jobs:
  numerical-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile autonomous C# mechanics experiment
        run: dotnet build experiments/FvmGenerativeDemo/FvmGenerativeDemo.csproj -c Release --warnaserror
      - name: Execute 3D bar and closed-loop FEM tests (PASS/FAIL)
        run: dotnet run --project experiments/FvmGenerativeDemo/FvmGenerativeDemo.csproj -c Release --no-build -- --self-test --out experiments/FvmGenerativeDemo/output
      - name: Run default three-step shape optimization and write BMP evidence
        run: dotnet run --project experiments/FvmGenerativeDemo/FvmGenerativeDemo.csproj -c Release --no-build -- --iterations 3 --out experiments/FvmGenerativeDemo/output/three-steps
      - name: Verify free-form two-sphere 3D FEM and adjoint shape updates
        run: dotnet run --project experiments/FvmGenerativeDemo/FvmGenerativeDemo.csproj -c Release --no-build -- --two-spheres --self-test --iterations 3 --out experiments/FvmGenerativeDemo/output/two-spheres-self-test
      - name: Generate printable two-sphere STL and M-image evidence
        run: dotnet run --project experiments/FvmGenerativeDemo/FvmGenerativeDemo.csproj -c Release --no-build -- --two-spheres --iterations 8 --out experiments/FvmGenerativeDemo/output/two-spheres
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate closed oriented STL and geometric mass reduction
        run: python experiments/FvmGenerativeDemo/validate_stl.py experiments/FvmGenerativeDemo/output/two-spheres/initial.stl experiments/FvmGenerativeDemo/output/two-spheres/optimized.stl
      - name: Solve a configurable rotated unequal-sphere JSON engineering scene
        run: dotnet run --project experiments/FvmGenerativeDemo/FvmGenerativeDemo.csproj -c Release --no-build -- --two-spheres --scene experiments/FvmGenerativeDemo/two_spheres_example.json --iterations 3 --out experiments/FvmGenerativeDemo/output/configured-spheres
      - name: Validate user-configured solid STL
        run: python experiments/FvmGenerativeDemo/validate_stl.py experiments/FvmGenerativeDemo/output/configured-spheres/initial.stl experiments/FvmGenerativeDemo/output/configured-spheres/optimized.stl
      - name: Multi-terminal CSG FVM-FEM thermal modal impact integration
        run: dotnet run --project experiments/FvmGenerativeDemo/FvmGenerativeDemo.csproj -c Release --no-build -- --multi-scene experiments/FvmGenerativeDemo/multi_scene_6_bodies.json --iterations 1 --self-test --out experiments/FvmGenerativeDemo/output/multi-6
      - name: Validate connected, watertight multi-terminal STL
        run: python experiments/FvmGenerativeDemo/validate_stl.py experiments/FvmGenerativeDemo/output/multi-6/initial.stl experiments/FvmGenerativeDemo/output/multi-6/optimized.stl
      - name: Force a real 3D detour around a blocking cylinder
        run: dotnet run --project experiments/FvmGenerativeDemo/FvmGenerativeDemo.csproj -c Release --no-build -- --multi-scene experiments/FvmGenerativeDemo/multi_scene_forced_detour.json --iterations 1 --out experiments/FvmGenerativeDemo/output/forced-detour
      - name: Check watertight, connected detour STL
        run: python experiments/FvmGenerativeDemo/validate_stl.py experiments/FvmGenerativeDemo/output/forced-detour/initial.stl experiments/FvmGenerativeDemo/output/forced-detour/optimized.stl
      - name: Generate binary STL input mesh from closed ASCII source
        run: python experiments/FvmGenerativeDemo/make_input_binary_stl.py experiments/FvmGenerativeDemo/input_cube_ascii.stl experiments/FvmGenerativeDemo/input_cube_binary.stl
      - name: Optimize arbitrary input STL, additional anchors and a keepout
        run: dotnet run --project experiments/FvmGenerativeDemo/FvmGenerativeDemo.csproj -c Release --no-build -- --multi-scene experiments/FvmGenerativeDemo/multi_scene_imported_stl.json --iterations 1 --out experiments/FvmGenerativeDemo/output/input-stl
      - name: Validate optimized CAD STL import result
        run: python experiments/FvmGenerativeDemo/validate_stl.py experiments/FvmGenerativeDemo/output/input-stl/initial.stl experiments/FvmGenerativeDemo/output/input-stl/optimized.stl
      - name: Run original five-M kernel tests
        run: dotnet test tests/DCad.FunctionalVoxel.Tests/DCad.FunctionalVoxel.Tests.csproj -c Release
      - name: Upload numerical CSV and BMP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fvm-fem-numerical-${{ matrix.os }}
          path: experiments/FvmGenerativeDemo/output/
          if-no-files-found: warn

  compare-original-python-fem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Obtain original Python FEM_Voxel branch read-only
        run: |
          git fetch --depth=1 origin FEM_Voxel
          mkdir -p original-python
          git archive FETCH_HEAD openscad_gen | tar -x -C original-python
      - name: Install original FEM numerical backend
        run: python -m pip install numpy scipy scikit-fem
      - name: Export standalone C# exact Hex8 stiffness
        run: dotnet run --project experiments/FvmGenerativeDemo/FvmGenerativeDemo.csproj -c Release -- --export-element-ke element-ke.csv
      - name: Compare 24x24 stiffness to original FEM_Voxel scikit-fem
        run: python experiments/FvmGenerativeDemo/compare_original_fem.py original-python element-ke.csv
