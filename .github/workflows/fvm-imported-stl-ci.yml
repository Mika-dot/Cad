name: FVM imported STL free topology
on:
  push:
    branches: [feature/fvm-generative-mechanics]
    paths:
      - 'experiments/FvmGenerativeDemo/free_topology_imported_stl.json'
      - 'experiments/FvmGenerativeDemo/FreeTopologyDesign.cs'
      - 'experiments/FvmGenerativeDemo/validate_free_topology.py'
      - '.github/workflows/fvm-imported-stl-ci.yml'
  workflow_dispatch:
jobs:
  imported-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build with warnings as errors
        run: dotnet build experiments/FvmGenerativeDemo/FvmGenerativeDemo.csproj -c Release --warnaserror
      - name: Prepare actual watertight binary STL source fixture
        run: python experiments/FvmGenerativeDemo/make_input_binary_stl.py experiments/FvmGenerativeDemo/input_cube_ascii.stl experiments/FvmGenerativeDemo/input_cube_binary.stl
      - name: Optimize free FVM topology around imported STL
        run: dotnet run --project experiments/FvmGenerativeDemo -c Release --no-build -- --free-topology experiments/FvmGenerativeDemo/free_topology_imported_stl.json --iterations 3 --gradient-check --self-test --out output/stl
      - name: Verify manifold STL and every protected solid and keepout
        run: |
          python experiments/FvmGenerativeDemo/validate_stl.py output/stl/initial.stl output/stl/optimized.stl
          python experiments/FvmGenerativeDemo/validate_free_topology.py experiments/FvmGenerativeDemo/free_topology_imported_stl.json output/stl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-fvm-imported-stl-results
          path: output/stl
          if-no-files-found: warn
