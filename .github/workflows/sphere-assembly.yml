name: Sphere assembly — console M-images

on:
  push:
    branches:
      - assembly/sphere-from-zero
  workflow_dispatch:

jobs:
  build-and-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build SphereAssembly.csproj -c Release --warnaserror
      - name: Verify scientific arithmetic
        run: dotnet run --project SphereAssembly.csproj -c Release --no-build -- --check
      - name: Create all sphere and circle M-images
        run: dotnet run --project SphereAssembly.csproj -c Release --no-build -- --size 7 --no-color --no-table
      - name: Verify BMP output count
        run: python -c "from pathlib import Path; a=list(Path('output').glob('*.bmp')); print('BMP count=',len(a)); assert len(a)==39, 'Expected 4 circle images + 5*7 sphere slices'; assert all(p.read_bytes()[:2] == b'BM' for p in a)"
      - name: Upload ready-to-open BMP pictures
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: sphere-assembly-M-images-BMP
          path: output/*.bmp
          if-no-files-found: error
