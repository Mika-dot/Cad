name: Modern Renderer CI

on:
  push:
    branches: [ "OpenGL" ]
  pull_request:
    branches: [ "OpenGL" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build ModernRenderer/DCad.Renderer.csproj -c Release
