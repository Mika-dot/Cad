name: AFVM Studio VS CI
on:
  push:
    branches: [ "Research-AFVM-Studio-CI2" ]
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Decode exact source archive
        shell: pwsh
        run: |
          $b64 = ((Get-Content .\ci\chunks\00.txt -Raw) + (Get-Content .\ci\chunks\01.txt -Raw) + (Get-Content .\ci\chunks\02.txt -Raw) + (Get-Content .\ci\chunks\03.txt -Raw)) -replace '\s',''
          [IO.File]::WriteAllBytes("AFVM_Studio_VS.zip", [Convert]::FromBase64String($b64))
          Expand-Archive .\AFVM_Studio_VS.zip -DestinationPath . -Force
      - name: Restore
        run: dotnet restore .\AFVM_Studio_VS\AFVM_Studio.sln
      - name: Build Release
        run: dotnet build .\AFVM_Studio_VS\AFVM_Studio.sln -c Release --no-restore
      - name: Unit tests
        run: dotnet test .\AFVM_Studio_VS\AFVM_Studio.sln -c Release --no-build --logger "console;verbosity=normal"
      - name: Publish Windows x64
        run: dotnet publish .\AFVM_Studio_VS\src\AFVM.Studio\AFVM.Studio.csproj -c Release -r win-x64 --self-contained true -o .\publish\AFVM_Studio_win-x64
